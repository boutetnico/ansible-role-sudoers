---
- name: Converge
  hosts: all
  roles:
    - role: boutetnico.sudoers
      sudoers_d_conf:
        php-fpm:
          - "envoyer ALL=(ALL) NOPASSWD: /usr/sbin/service php*-fpm reload"
        nginx:
          - "deploy ALL=(ALL) NOPASSWD: /usr/sbin/service nginx reload"
          - "deploy ALL=(ALL) NOPASSWD: /usr/sbin/service nginx restart"
